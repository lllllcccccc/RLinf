defaults:
  - env/libero_spatial@env.eval
  - model/pi0_5_rlinf@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_openpi_pi05_rlinf_eval"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: -1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  eval:
    rollout_epoch: 5
    total_num_envs: 20
    auto_reset: True
    ignore_terminations: True
    # LIBERO-Spatial convention in this repo: 240-step horizon (object used 280).
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 1200
    group_size: 1
    use_fixed_reset_state_ids: True
    task_id_filter: null
    specific_task_id: null
    specific_trial_id: null
    prompt_override: null
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  pipeline_stage_num: 1

  model:
    model_type: "openpi_rlinf"
    model_path: "/mnt/public2/luoxi/models/RLinf-Pi05-LIBERO-SFT"
    precision: null
    pi05: True
    num_action_chunks: 5
    action_dim: 7
    num_steps: 5
    add_value_head: False

    openpi_data:
      norm_stats_path: ${..model_path}/physical-intelligence/libero/norm_stats.json

    openpi:
      task: "eval"
      config_name: "pi05_libero"
      num_images_in_input: 2
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}
      discrete_state_input: False
